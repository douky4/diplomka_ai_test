<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Administrace výzkumu</title><link rel="stylesheet" href="admin.css">
</head>
<body><main>
  <a href="./">← Zpět na kvíz</a>
  <h1>Administrace výzkumu</h1>
  <form id="login-form">
    <label for="password">Heslo do administrace</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <button type="submit">Přihlásit</button>
  </form>
  <p id="admin-status" role="status" aria-live="polite"></p>
  <section id="dashboard" hidden>
    <div class="toolbar">
      <button id="refresh" type="button">Obnovit výsledky</button>
      <button id="export" type="button">Export CSV</button>
      <button id="logout" type="button">Odhlásit</button>
    </div>
    <div id="overview" class="card"></div>
    <nav><a href="#respondents">Respondenti</a><a href="#ages">Věkové skupiny</a><a href="#images">Obrázky a jistota</a></nav>
    <section id="respondents"><h2>Respondenti</h2><div id="participant-table"></div></section>
    <section id="ages"><h2>Věkové skupiny</h2><div id="age-table"></div></section>
    <section id="images"><h2>Výsledky podle obrázků</h2>
      <p>Počet přidělení zahrnuje i nedokončené testy. Obtížnost v zadání generátoru není změřená obtížnost pro respondenty.</p>
      <label for="image-filter">Zobrazit</label>
      <select id="image-filter"><option value="all">Všechny obrázky</option><option value="ai">AI</option><option value="photo">Fotografie</option></select>
      <div id="image-results"></div>
    </section>
  </section>
</main>
<script src="config.js"></script><script src="quiz-api.js"></script><script src="analytics.js"></script><script src="admin.js"></script>
</body></html>
